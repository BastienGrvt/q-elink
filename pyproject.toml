[tool.poetry]
name = "q-elink"
version = "0.1.0"
description = "Quantum elementary link modelization."
authors = ["BastienGrvt <73183679+BastienGrvt@users.noreply.github.com>"]
readme = "README.md"
packages = [{ include = "q_elink", from = "src" }]

[tool.poetry.dependencies]
python = "^3.13"
matplotlib = "^3.10.3"
numpy = "^2.3.1"
tqdm = "^4.67.1"
scipy = "^1.16.1"
rich = "^14.1.0"
# bastools = { git = "https://github.com/BastienGrvt/bastools" }
bastools = { path = "../bastools", develop=true }


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
