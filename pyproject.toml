[project]
name = "q-elink"
version = "0.1.2"
description = "Numerical characterization of an elementary link of a quantum repeater: local probabilities, visibility, entanglement witness, etc."
authors = [{ name = "Bastien Grivet", email = "73183679+BastienGrvt@users.noreply.github.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<4"
dependencies = [
    "matplotlib>=3.10.3,<4",
    "numpy>=2.3.1,<3",
    "tqdm>=4.67.1,<5",
    "scipy>=1.16.1,<2",
    "rich>=14.1.0,<15",
    "bastools>=0.1.1",
]

[project.urls]
Homepage = "https://github.com/BastienGrvt/q-elink"
Issues = "https://github.com/BastienGrvt/q-elink/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/q_elink"]

