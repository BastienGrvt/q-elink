[project]
name = "q-elink"
version = "0.1.0"
requires-python = ">=3.13,<4"
dependencies = [
    "matplotlib>=3.10.3,<4",
    "numpy>=2.3.1,<3",
    "tqdm>=4.67.1,<5",
    "scipy>=1.16.1,<2",
    "rich>=14.1.0,<15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/q_elink"]
